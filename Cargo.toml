[package]
name = "transpiler-infinite"
version = "0.1.0"
edition = "2026"
description = "Universal code-to-code transpiler for translating between (almot) any programming languages."
license = "GPL-3.0-only"
readme = "README.md"
repository = "https://github.com/tomanyy/transpiler-infinite"
keywords = ["transpiler", "parser", "wasm"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
